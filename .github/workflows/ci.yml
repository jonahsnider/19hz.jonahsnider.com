name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
      - parallel:
          - name: Build for production
            run: pnpm run build
          - name: Lint
            run: pnpm run lint
          - name: Test
            run: pnpm run test
