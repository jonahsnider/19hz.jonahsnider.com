name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    timeout-minutes: 5

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
          require-lockfile: true
      - parallel:
          - name: Build for production
            run: pnpm run build
          - name: Lint
            run: pnpm run lint
          - name: Check formatting
            run: pnpm run format
          - name: Check unused dependencies and exports
            run: pnpm run knip
          - name: Test
            run: pnpm run test
